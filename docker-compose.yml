# TODO: https://docs.docker.com/compose/how-tos/file-watch/
services:
  client:
    container_name: boycott-this-client
    build:
      context: .
      dockerfile: client/dockerfile
    develop:
      watch:
        - action: sync
          path: ./client
          target: /client
    image: boycott-this-client
    volumes:
      - client:/client
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    restart: unless-stopped
  api:
    container_name: boycott-this-api
    build:
      context: .
      dockerfile: api/dockerfile
    develop:
      watch:
        - action: sync
          path: ./api
          target: /api
    image: boycott-this-api
    volumes:
      - api:/api
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  api:
    name: "boycott-this-api"
  client:
    name: "boycott-this-client"